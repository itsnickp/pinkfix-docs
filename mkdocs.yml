site_name: Pink Fix
site_description: Find, relink and pack missing textures and files in Blender
site_url: https://itsnickp.github.io/pinkfix-docs/
repo_url: https://github.com/itsnickp/pinkfix-docs
repo_name: itsnickp/pinkfix-docs
theme:
  name: material
  palette:
    scheme: slate
    primary: pink
    accent: pink
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.keys
  - toc:
      permalink: true
nav:
  - Quick start: index.md
  - Showcase: showcase.md
  - Install: install.md
  - Panels: panels.md
  - FAQ: faq.md
  - Connect Superhive for updates: updates.md
  - Troubleshooting: troubleshooting.md
